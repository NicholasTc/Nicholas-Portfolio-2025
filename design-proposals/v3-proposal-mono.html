<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>v3 Proposal — Mono Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0b;
      --ink: #f4f5f6;
      --soft: rgba(244,245,246,0.60);
      --mute: rgba(244,245,246,0.34);
      --line: rgba(244,245,246,0.10);
      --line2: rgba(244,245,246,0.20);
      --glass: rgba(255,255,255,0.035);
      --font: "Inter", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }

    /* Restrained monochrome ambience — faint top light + vignette only */
    .amb {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(60% 50% at 50% -8%, rgba(255,255,255,0.06), transparent 60%),
        radial-gradient(120% 90% at 50% 16%, transparent 42%, rgba(0,0,0,0.5) 100%);
    }

    /* Top brand */
    .brand {
      position: fixed; top: 20px; left: 22px; z-index: 40;
      display: flex; align-items: center; gap: 10px;
      padding: 6px 13px 6px 7px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(12px);
      font-size: 13px; font-weight: 500; letter-spacing: 0.01em;
    }
    .brand .mark { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line2); border-radius: 8px; font-weight: 700; font-size: 13px; }
    .corner { position: fixed; top: 26px; right: 26px; z-index: 40; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); }

    /* ===== HERO (sticky pin; scroll opens the cards) ===== */
    .hero { position: relative; height: 220vh; z-index: 2; }
    .pin { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; perspective: 1500px; }
    .scene { position: relative; transform-style: preserve-3d; --open: 0; will-change: transform; }

    /* ===== Intro card — minimal mono glass ===== */
    .card {
      position: relative; z-index: 10;
      transform: translateZ(70px);
      padding: 38px 44px 30px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(20,21,23,0.82), rgba(12,13,15,0.82));
      border: 1px solid var(--line);
      box-shadow: 0 34px 90px -34px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    .card p {
      font-size: clamp(20px, 2.5vw, 30px);
      font-weight: 400; line-height: 1.95; letter-spacing: -0.005em;
      white-space: nowrap; color: var(--soft);
    }
    .card p .lead { color: var(--ink); font-weight: 500; }

    /* Thin outlined monochrome chips */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 1px 13px; margin: 0 1px;
      border: 1px solid var(--line2); border-radius: 9px;
      background: rgba(255,255,255,0.04);
      color: var(--ink); font-weight: 600;
      transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
    }
    .chip:hover { border-color: rgba(244,245,246,0.42); background: rgba(255,255,255,0.07); }
    .chip .arr { color: var(--mute); font-size: 0.82em; }

    .hint {
      margin-top: 22px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute);
      transition: opacity 0.4s ease;
    }

    /* ===== Project tiles (fan out from behind the card) ===== */
    .cards { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
    .tile {
      position: absolute; top: 50%; left: 50%; width: 232px;
      transform-style: preserve-3d;
      opacity: var(--open);
      transform:
        translate(-50%,-50%)
        translate3d(calc(var(--x) * var(--open)), calc(var(--y) * var(--open)), calc(var(--z) * var(--open)))
        rotateX(calc(var(--rx) * var(--open))) rotateY(calc(var(--ry) * var(--open))) rotateZ(calc(var(--rot) * var(--open)))
        scale(calc(0.55 + 0.45 * var(--open)));
      will-change: transform, opacity;
    }
    .biz {
      pointer-events: auto;
      border-radius: 14px; overflow: hidden;
      background: linear-gradient(180deg, #141517, #0e0f11);
      border: 1px solid var(--line);
      box-shadow: 0 26px 60px -24px rgba(0,0,0,0.9);
      transition: transform 0.45s cubic-bezier(.2,.7,.2,1), box-shadow 0.45s ease, border-color 0.45s ease;
    }
    .biz:hover { transform: translateY(-7px); border-color: var(--line2); box-shadow: 0 38px 72px -22px rgba(0,0,0,0.95); }
    .biz .thumb { height: 132px; overflow: hidden; background: #0a0b0c; }
    .biz .thumb img {
      width: 100%; height: 100%; object-fit: cover; object-position: top;
      filter: grayscale(1) contrast(1.05) brightness(0.86);
      transition: filter 0.5s ease, transform 0.6s ease;
    }
    .biz:hover .thumb img { filter: grayscale(1) contrast(1.08) brightness(1.0); transform: scale(1.04); }
    .biz .row { display: flex; align-items: center; gap: 9px; padding: 11px 13px; border-top: 1px solid var(--line); }
    .biz .idx { font-family: var(--mono); font-size: 11px; color: var(--mute); }
    .biz .nm { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .biz .tg { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--mute); }

    /* Scroll cue */
    .cue { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); z-index: 12; }
    .cue .m { width: 20px; height: 32px; border: 1.5px solid var(--mute); border-radius: 11px; position: relative; }
    .cue .m::after { content:""; position:absolute; left:50%; top:6px; width:3px; height:6px; background: var(--mute); border-radius:2px; transform: translateX(-50%); animation: wheel 1.6s ease-in-out infinite; }

    /* Intro reveal for the card */
    .card { opacity: 0; transform: translateZ(70px) translateY(14px); animation: rise 0.9s 0.15s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { to { opacity: 1; transform: translateZ(70px) translateY(0); } }
    @keyframes wheel { 0%,100%{transform:translate(-50%,0);opacity:1} 50%{transform:translate(-50%,7px);opacity:.3} }

    @media (max-width: 820px) {
      .card p { font-size: 18px; white-space: normal; line-height: 1.8; }
      .tile { width: 168px; }
    }
    @media (max-width: 540px) {
      .scene { transform: none !important; }
      .tile { width: 132px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .card { animation-duration: 0.001s !important; }
      .cue .m::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="amb" aria-hidden="true"></div>

  <a href="#top" class="brand"><span class="mark">N</span> Nicholas Chan</a>
  <div class="corner">Portfolio — 2026</div>

  <section class="hero" id="top">
    <div class="pin">
      <div class="scene" id="scene">

        <!-- Project tiles -->
        <div class="cards" id="cards">
          <div class="tile" style="--x:-380px; --y:-150px; --z:-40px; --rx:6deg;  --ry:18deg;  --rot:-7deg;">
            <div class="biz"><div class="thumb"><img src="../public/FitFlowScreenshot.png" alt="FitFlow"></div><div class="row"><span class="idx">01</span><span class="nm">FitFlow</span><span class="tg">MERN</span></div></div>
          </div>
          <div class="tile" style="--x:385px; --y:-186px; --z:-90px; --rx:7deg;  --ry:-18deg; --rot:8deg;">
            <div class="biz"><div class="thumb"><img src="../public/ResumeAITool.png" alt="ResumeAI"></div><div class="row"><span class="idx">02</span><span class="nm">ResumeAI</span><span class="tg">OpenAI</span></div></div>
          </div>
          <div class="tile" style="--x:-470px; --y:130px; --z:-30px; --rx:-5deg; --ry:22deg;  --rot:-5deg;">
            <div class="biz"><div class="thumb"><img src="../public/PollenAtlas.png" alt="Pollen Atlas"></div><div class="row"><span class="idx">03</span><span class="nm">Pollen Atlas</span><span class="tg">API</span></div></div>
          </div>
          <div class="tile" style="--x:475px; --y:96px; --z:-120px; --rx:-5deg; --ry:-22deg; --rot:7deg;">
            <div class="biz"><div class="thumb"><img src="../public/ProductivityHelper.png" alt="Productivity"></div><div class="row"><span class="idx">04</span><span class="nm">Productivity</span><span class="tg">Tool</span></div></div>
          </div>
          <div class="tile" style="--x:-150px; --y:312px; --z:10px;  --rx:-10deg; --ry:8deg;  --rot:-3deg;">
            <div class="biz"><div class="thumb"><img src="../public/GymAppScreenshot.png" alt="Gym App"></div><div class="row"><span class="idx">05</span><span class="nm">Gym App</span><span class="tg">Mobile</span></div></div>
          </div>
          <div class="tile" style="--x:185px; --y:300px; --z:-50px; --rx:-9deg; --ry:-8deg; --rot:4deg;">
            <div class="biz"><div class="thumb"><img src="../public/FitAI/fitai-dashboard.png" alt="FitAI"></div><div class="row"><span class="idx">06</span><span class="nm">FitAI</span><span class="tg">Health</span></div></div>
          </div>
        </div>

        <!-- Intro card -->
        <div class="card" id="card">
          <p><span class="lead">Hey, I'm</span> <span class="chip">Nicholas</span></p>
          <p>I'm a <span class="chip">Full-Stack Engineer</span></p>
          <p>currently studying at <span class="chip">UC San Diego <span class="arr">&#8599;</span></span></p>
          <div class="hint" id="hint">hover to peek · scroll to explore</div>
        </div>

      </div>

      <div class="cue" id="cue"><span class="m"></span> Scroll</div>
    </div>
  </section>

  <script>
    (function () {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const hero = document.getElementById('top');
      const pin = document.querySelector('.pin');
      const scene = document.getElementById('scene');
      const card = document.getElementById('card');
      const cue = document.getElementById('cue');
      const hint = document.getElementById('hint');

      const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
      const smooth = (t) => t*t*(3-2*t);

      let p = 0, hoverTarget = 0, hover = 0, mx = 0, my = 0, cmx = 0, cmy = 0;

      function computeP() {
        const total = hero.offsetHeight - window.innerHeight;
        p = total > 0 ? clamp(-hero.getBoundingClientRect().top / total, 0, 1) : 0;
      }
      window.addEventListener('scroll', computeP, { passive: true });
      window.addEventListener('resize', computeP);
      computeP();

      if (!reduce) {
        pin.addEventListener('pointermove', (e) => {
          const r = pin.getBoundingClientRect();
          mx = ((e.clientX - r.left)/r.width - 0.5) * 2;
          my = ((e.clientY - r.top)/r.height - 0.5) * 2;
        });
        card.addEventListener('pointerenter', () => { hoverTarget = 1; });
        card.addEventListener('pointerleave', () => { hoverTarget = 0; });
      }

      function loop() {
        const scrollOpen = smooth(clamp(p / 0.60, 0, 1));
        hover += (hoverTarget - hover) * 0.09;
        const open = Math.max(scrollOpen, hover * 0.5);
        cmx += (mx - cmx) * 0.06; cmy += (my - cmy) * 0.06;

        scene.style.setProperty('--open', open.toFixed(4));
        scene.style.transform = `rotateX(${(-cmy*5).toFixed(2)}deg) rotateY(${(cmx*7).toFixed(2)}deg)`;
        cue.style.opacity = (1 - clamp(p/0.12, 0, 1)).toFixed(3);
        if (hint) hint.style.opacity = (1 - Math.max(scrollOpen, hover)).toFixed(3);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
